<svg xmlns="http://www.w3.org/2000/svg" width="495" height="190" viewBox="0 0 495 190" role="img" aria-labelledby="title desc">
  <title id="title">Resumo do GitHub</title>
  <desc id="desc">Dados públicos atualizados do perfil GitHub de IcaroFranca</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#0e7490" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <style>
      .title { fill: #22d3ee; font: 600 18px 'Segoe UI', Ubuntu, sans-serif; }
      .value { fill: #e6edf3; font: 700 25px 'Segoe UI', Ubuntu, sans-serif; }
      .label { fill: #8b949e; font: 400 12px 'Segoe UI', Ubuntu, sans-serif; }
      .small { fill: #8b949e; font: 400 11px 'Segoe UI', Ubuntu, sans-serif; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="189" rx="12" fill="#0d1117" stroke="#30363d" />
  <rect x="0" y="0" width="5" height="190" rx="3" fill="url(#accent)" />
  <text x="24" y="35" class="title">GitHub em números</text>
  <text x="36" y="72" class="value">24</text>
  <text x="36" y="92" class="label">repositórios públicos</text>
  <text x="270" y="72" class="value">11</text>
  <text x="270" y="92" class="label">seguidores</text>
  <text x="36" y="142" class="value">29</text>
  <text x="36" y="162" class="label">commits públicos · 1 ano</text>
  <text x="270" y="142" class="value">8</text>
  <text x="270" y="162" class="label">anos no GitHub</text>
</svg>
