<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Stack dividida por área</title>
  <desc id="desc">Tecnologias utilizadas por Icaro em frontend, backend e APIs, dados, integrações e entrega</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#071a1f"/>
      <stop offset="0.5" stop-color="#0d282e"/>
      <stop offset="1" stop-color="#071a1f"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#25c4c7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#25c4c7" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#25c4c7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .kicker { font: 600 11px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 2px; fill: #25c4c7; }
      .area { font: 700 15px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 1px; fill: #f3f1e9; }
      .icon { font: 800 17px 'Segoe UI', Ubuntu, sans-serif; }
      .label { font: 600 9px 'Segoe UI', Ubuntu, sans-serif; fill: #b8c9ca; }
      .summary { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #8ba4a6; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="389" rx="16" fill="url(#bg)" stroke="#25464c"/>
  <rect x="-260" width="260" height="390" fill="url(#scan)"><animate attributeName="x" values="-260;1200" dur="9s" repeatCount="indefinite"/></rect>
  <text class="kicker" x="35" y="35">STACK · ORGANIZADA POR RESPONSABILIDADE</text>
  <line x1="400" y1="58" x2="400" y2="350" stroke="#34555a"/>
  <line x1="800" y1="58" x2="800" y2="350" stroke="#34555a"/>

  <!-- Frontend -->
  <g transform="translate(0 0)">
    <text class="area" x="200" y="83" text-anchor="middle">FRONTEND</text>

    <g transform="translate(35 112)">
      <rect width="48" height="48" rx="11" fill="#102f35" stroke="#61dafb"/>
      <g transform="translate(24 24)" fill="none" stroke="#61dafb" stroke-width="1.6"><ellipse rx="15" ry="5.5"/><ellipse rx="15" ry="5.5" transform="rotate(60)"/><ellipse rx="15" ry="5.5" transform="rotate(120)"/><circle r="2.5" fill="#61dafb"/></g>
      <text class="label" x="24" y="66" text-anchor="middle">React</text>
      <animate attributeName="opacity" values="0.76;1;0.76" dur="4s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(95 112)">
      <rect width="48" height="48" rx="11" fill="#3178c6"/>
      <text class="icon" x="24" y="31" text-anchor="middle" fill="#fff">TS</text><text class="label" x="24" y="66" text-anchor="middle">TypeScript</text>
      <animate attributeName="opacity" values="0.76;1;0.76" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(155 112)">
      <rect width="48" height="48" rx="11" fill="#f7df1e"/>
      <text class="icon" x="24" y="31" text-anchor="middle" fill="#071a1f">JS</text><text class="label" x="24" y="66" text-anchor="middle">JavaScript</text>
      <animate attributeName="opacity" values="0.76;1;0.76" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(215 112)">
      <rect width="48" height="48" rx="11" fill="#24283b" stroke="#a78bfa"/>
      <path d="M10 12h28L24 39Z" fill="#a78bfa"/><path d="m24 19 8-7-8 20-8 7Z" fill="#f2b84b"/>
      <text class="label" x="24" y="66" text-anchor="middle">Vite</text>
      <animate attributeName="opacity" values="0.76;1;0.76" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(275 112)">
      <rect width="48" height="48" rx="11" fill="#e34f26"/>
      <text class="icon" x="24" y="31" text-anchor="middle" fill="#fff">H5</text><text class="label" x="24" y="66" text-anchor="middle">HTML</text>
      <animate attributeName="opacity" values="0.76;1;0.76" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(335 112)">
      <rect width="48" height="48" rx="11" fill="#1572b6"/>
      <text class="icon" x="24" y="31" text-anchor="middle" fill="#fff">C3</text><text class="label" x="24" y="66" text-anchor="middle">CSS</text>
      <animate attributeName="opacity" values="0.76;1;0.76" dur="4s" begin="2s" repeatCount="indefinite"/>
    </g>

    <text class="summary" x="200" y="225" text-anchor="middle">Interfaces responsivas · componentes · estado</text>
    <text class="summary" x="200" y="245" text-anchor="middle">experiência de uso · design systems</text>
  </g>

  <!-- Backend -->
  <g transform="translate(400 0)">
    <text class="area" x="200" y="83" text-anchor="middle">BACKEND &amp; APIs</text>

    <g transform="translate(79 112)">
      <rect width="54" height="54" rx="12" fill="#102f35" stroke="#5fa04e"/>
      <path d="M27 8 45 18v20L27 48 9 38V18Z" fill="none" stroke="#5fa04e" stroke-width="2"/><text class="icon" x="27" y="34" text-anchor="middle" fill="#5fa04e">N</text>
      <text class="label" x="27" y="72" text-anchor="middle">Node.js</text>
      <animate attributeName="opacity" values="0.76;1;0.76" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(142 112)">
      <rect width="54" height="54" rx="12" fill="#24283b" stroke="#f3f1e9"/>
      <text x="27" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#f3f1e9">EX</text><text class="label" x="27" y="72" text-anchor="middle">Express</text>
      <animate attributeName="opacity" values="0.76;1;0.76" dur="4s" begin="1s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(205 112)">
      <rect width="54" height="54" rx="12" fill="#102f35" stroke="#f2b84b"/>
      <path d="M15 36h25v5c0 5-6 8-13 8s-12-3-12-8Zm25 2h4c5 0 5 8 0 8h-6M21 31c-6-6 6-8 0-15M30 31c-6-6 6-8 0-15" fill="none" stroke="#f2b84b" stroke-width="1.7"/>
      <text class="label" x="27" y="72" text-anchor="middle">Java</text>
      <animate attributeName="opacity" values="0.76;1;0.76" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(268 112)">
      <rect width="54" height="54" rx="12" fill="#102f35" stroke="#25c4c7"/>
      <text x="27" y="34" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#25c4c7">{ }</text><text class="label" x="27" y="72" text-anchor="middle">REST</text>
      <animate attributeName="opacity" values="0.76;1;0.76" dur="4s" begin="2s" repeatCount="indefinite"/>
    </g>

    <text class="summary" x="200" y="225" text-anchor="middle">Regras de negócio · autenticação · contratos</text>
    <text class="summary" x="200" y="245" text-anchor="middle">APIs REST · integrações entre sistemas</text>
  </g>

  <!-- Dados, integrações e entrega -->
  <g transform="translate(800 0)">
    <text class="area" x="200" y="83" text-anchor="middle">DADOS · INTEGRAÇÕES · ENTREGA</text>

    <g transform="translate(35 106)"><rect width="48" height="48" rx="11" fill="#102f35" stroke="#3fcf8e"/><path d="m28 8-14 22h12l-4 12 14-23H25Z" fill="#3fcf8e"/><text class="label" x="24" y="66" text-anchor="middle">Supabase</text></g>
    <g transform="translate(95 106)"><rect width="48" height="48" rx="11" fill="#102f35" stroke="#4169e1"/><text x="24" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#7ea1ff">PG</text><text class="label" x="24" y="66" text-anchor="middle">PostgreSQL</text></g>
    <g transform="translate(155 106)"><rect width="48" height="48" rx="11" fill="#102f35" stroke="#38bdf8"/><ellipse cx="24" cy="14" rx="13" ry="5" fill="none" stroke="#38bdf8" stroke-width="1.7"/><path d="M11 14v21c0 4 6 6 13 6s13-2 13-6V14M11 25c0 4 6 6 13 6s13-2 13-6" fill="none" stroke="#38bdf8" stroke-width="1.7"/><text class="label" x="24" y="66" text-anchor="middle">SQLite</text></g>
    <g transform="translate(215 106)"><rect width="48" height="48" rx="11" fill="#102f35" stroke="#fb7185"/><text x="24" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#fb7185">ORA</text><text class="label" x="24" y="66" text-anchor="middle">Oracle</text></g>
    <g transform="translate(275 106)"><rect width="48" height="48" rx="11" fill="#102f35" stroke="#2496ed"/><g fill="#2496ed"><rect x="9" y="18" width="8" height="7"/><rect x="19" y="18" width="8" height="7"/><rect x="29" y="18" width="8" height="7"/><rect x="19" y="9" width="8" height="7"/><path d="M7 28h35c-2 10-8 15-18 15S9 38 7 28Z"/></g><text class="label" x="24" y="66" text-anchor="middle">Docker</text></g>
    <g transform="translate(335 106)"><rect width="48" height="48" rx="11" fill="#102f35" stroke="#a78bfa"/><g fill="none" stroke="#a78bfa" stroke-width="1.8"><circle cx="15" cy="14" r="5"/><circle cx="34" cy="24" r="5"/><circle cx="15" cy="36" r="5"/><path d="M20 14h5c6 0 9 4 9 8M20 36h5c6 0 9-4 9-8"/></g><text class="label" x="24" y="66" text-anchor="middle">Actions</text></g>

    <g transform="translate(125 198)"><rect width="54" height="54" rx="12" fill="#102f35" stroke="#f05032"/><g fill="none" stroke="#f05032" stroke-width="2"><circle cx="17" cy="15" r="4"/><circle cx="37" cy="28" r="4"/><circle cx="17" cy="41" r="4"/><path d="M21 15h5c8 0 11 5 11 9M21 41h5c8 0 11-5 11-9"/></g><text class="label" x="27" y="72" text-anchor="middle">Git</text></g>
    <g transform="translate(188 198)"><rect width="54" height="54" rx="12" fill="#102f35" stroke="#f2b84b"/><rect x="16" y="26" width="22" height="18" rx="4" fill="none" stroke="#f2b84b" stroke-width="2"/><path d="M20 26v-5a7 7 0 0 1 14 0v5" fill="none" stroke="#f2b84b" stroke-width="2"/><text class="label" x="27" y="72" text-anchor="middle">SSO/OIDC</text></g>
    <g transform="translate(251 198)"><rect width="54" height="54" rx="12" fill="#102f35" stroke="#4ade80"/><path d="m14 28 8 8 18-19" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/><text class="label" x="27" y="72" text-anchor="middle">Testes</text></g>

    <text class="summary" x="200" y="310" text-anchor="middle">SQL · ERP · CI/CD · containers · identidade</text>
    <text class="summary" x="200" y="330" text-anchor="middle">dados confiáveis até a produção</text>
  </g>

  <path d="M35 360 H1165" stroke="#34555a" stroke-width="1.5"/>
  <circle r="4" fill="#f2b84b"><animateMotion path="M35 360 H1165" dur="7s" repeatCount="indefinite"/></circle>
</svg>

