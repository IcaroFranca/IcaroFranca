<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">Stack detalhada por área</title>
  <desc id="desc">Linguagens, frontend, backend, dados, integrações, segurança, DevOps, testes e qualidade utilizados por Icaro</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#071a1f"/>
      <stop offset="0.5" stop-color="#0d282e"/>
      <stop offset="1" stop-color="#071a1f"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#25c4c7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#25c4c7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#25c4c7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .kicker { font: 600 11px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 2.2px; fill: #25c4c7; }
      .category { font: 700 15px 'Segoe UI', Ubuntu, sans-serif; fill: #f3f1e9; }
      .badge { font: 700 11px 'Segoe UI', Ubuntu, sans-serif; fill: #ffffff; }
      .badge-dark { font: 700 11px 'Segoe UI', Ubuntu, sans-serif; fill: #071a1f; }
      .abbr { font: 800 10px 'Segoe UI', Ubuntu, sans-serif; fill: #ffffff; }
      .abbr-dark { font: 800 10px 'Segoe UI', Ubuntu, sans-serif; fill: #071a1f; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="709" rx="16" fill="url(#bg)" stroke="#25464c"/>
  <rect x="-260" width="260" height="710" fill="url(#scan)"><animate attributeName="x" values="-260;1200" dur="10s" repeatCount="indefinite"/></rect>
  <text class="kicker" x="35" y="34">STACK · DO FUNDAMENTO À PRODUÇÃO</text>
  <line x1="35" y1="48" x2="1165" y2="48" stroke="#34555a"/>

  <!-- Linguagens -->
  <g>
    <text class="category" x="600" y="78" text-anchor="middle">LINGUAGENS</text>
    <g transform="translate(282 94)"><rect width="96" height="32" rx="6" fill="#e34f26"/><text class="abbr" x="13" y="21">H5</text><text class="badge" x="34" y="21">HTML5</text></g>
    <g transform="translate(386 94)"><rect width="82" height="32" rx="6" fill="#1572b6"/><text class="abbr" x="13" y="21">C3</text><text class="badge" x="34" y="21">CSS3</text></g>
    <g transform="translate(476 94)"><rect width="118" height="32" rx="6" fill="#f7df1e"/><text class="abbr-dark" x="13" y="21">JS</text><text class="badge-dark" x="34" y="21">JavaScript</text></g>
    <g transform="translate(602 94)"><rect width="120" height="32" rx="6" fill="#3178c6"/><text class="abbr" x="13" y="21">TS</text><text class="badge" x="34" y="21">TypeScript</text></g>
    <g transform="translate(730 94)"><rect width="84" height="32" rx="6" fill="#ed8b00"/><text class="abbr" x="13" y="21">J</text><text class="badge" x="32" y="21">Java</text></g>
    <g transform="translate(822 94)"><rect width="72" height="32" rx="6" fill="#0891b2"/><text class="abbr" x="13" y="21">DB</text><text class="badge" x="37" y="21">SQL</text></g>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" begin="0s" repeatCount="indefinite"/>
  </g>

  <!-- Frontend -->
  <g>
    <text class="category" x="600" y="168" text-anchor="middle">FRONTEND</text>
    <g transform="translate(277 184)"><rect width="92" height="32" rx="6" fill="#087ea4"/><text class="abbr" x="13" y="21">⚛</text><text class="badge" x="35" y="21">React</text></g>
    <g transform="translate(377 184)"><rect width="80" height="32" rx="6" fill="#7c3aed"/><text class="abbr" x="13" y="21">V</text><text class="badge" x="33" y="21">Vite</text></g>
    <g transform="translate(465 184)"><rect width="108" height="32" rx="6" fill="#06b6d4"/><text class="abbr" x="13" y="21">≈</text><text class="badge" x="34" y="21">Tailwind</text></g>
    <g transform="translate(581 184)"><rect width="124" height="32" rx="6" fill="#e11d48"/><text class="abbr" x="13" y="21">RR</text><text class="badge" x="39" y="21">React Router</text></g>
    <g transform="translate(713 184)"><rect width="104" height="32" rx="6" fill="#16a34a"/><text class="abbr" x="13" y="21">↗</text><text class="badge" x="34" y="21">Recharts</text></g>
    <g transform="translate(825 184)"><rect width="98" height="32" rx="6" fill="#27272a" stroke="#71717a"/><text class="abbr" x="13" y="21">UI</text><text class="badge" x="37" y="21">shadcn</text></g>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" begin="0.7s" repeatCount="indefinite"/>
  </g>

  <!-- Backend -->
  <g>
    <text class="category" x="600" y="258" text-anchor="middle">BACKEND &amp; APIs</text>
    <g transform="translate(375 274)"><rect width="100" height="32" rx="6" fill="#3c873a"/><text class="abbr" x="13" y="21">N</text><text class="badge" x="34" y="21">Node.js</text></g>
    <g transform="translate(483 274)"><rect width="98" height="32" rx="6" fill="#27272a" stroke="#71717a"/><text class="abbr" x="13" y="21">EX</text><text class="badge" x="39" y="21">Express</text></g>
    <g transform="translate(589 274)"><rect width="104" height="32" rx="6" fill="#0e7490"/><text class="abbr" x="13" y="21">{ }</text><text class="badge" x="40" y="21">REST APIs</text></g>
    <g transform="translate(701 274)"><rect width="124" height="32" rx="6" fill="#7c3aed"/><text class="abbr" x="13" y="21">ƒ</text><text class="badge" x="34" y="21">Edge Functions</text></g>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" begin="1.4s" repeatCount="indefinite"/>
  </g>

  <!-- Bancos e serviços -->
  <g>
    <text class="category" x="600" y="348" text-anchor="middle">BANCOS DE DADOS &amp; SERVIÇOS</text>
    <g transform="translate(316 364)"><rect width="112" height="32" rx="6" fill="#16a76a"/><text class="abbr" x="13" y="21">S</text><text class="badge" x="34" y="21">Supabase</text></g>
    <g transform="translate(436 364)"><rect width="126" height="32" rx="6" fill="#336791"/><text class="abbr" x="13" y="21">PG</text><text class="badge" x="39" y="21">PostgreSQL</text></g>
    <g transform="translate(570 364)"><rect width="90" height="32" rx="6" fill="#0f80cc"/><text class="abbr" x="13" y="21">SQ</text><text class="badge" x="39" y="21">SQLite</text></g>
    <g transform="translate(668 364)"><rect width="88" height="32" rx="6" fill="#c74634"/><text class="abbr" x="13" y="21">O</text><text class="badge" x="32" y="21">Oracle</text></g>
    <g transform="translate(764 364)"><rect width="120" height="32" rx="6" fill="#f2b84b"/><text class="abbr-dark" x="13" y="21">ERP</text><text class="badge-dark" x="43" y="21">FoccoERP</text></g>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" begin="2.1s" repeatCount="indefinite"/>
  </g>

  <!-- Integrações e segurança -->
  <g>
    <text class="category" x="600" y="438" text-anchor="middle">INTEGRAÇÕES &amp; SEGURANÇA</text>
    <g transform="translate(305 454)"><rect width="108" height="32" rx="6" fill="#0891b2"/><text class="abbr" x="13" y="21">API</text><text class="badge" x="42" y="21">FoccoAPI</text></g>
    <g transform="translate(421 454)"><rect width="76" height="32" rx="6" fill="#db2777"/><text class="abbr" x="13" y="21">🔒</text><text class="badge" x="37" y="21">SSO</text></g>
    <g transform="translate(505 454)"><rect width="78" height="32" rx="6" fill="#7c3aed"/><text class="abbr" x="13" y="21">ID</text><text class="badge" x="37" y="21">OIDC</text></g>
    <g transform="translate(591 454)"><rect width="82" height="32" rx="6" fill="#2563eb"/><text class="abbr" x="13" y="21">R</text><text class="badge" x="32" y="21">RBAC</text></g>
    <g transform="translate(681 454)"><rect width="100" height="32" rx="6" fill="#16a34a"/><text class="abbr" x="13" y="21">RO</text><text class="badge" x="39" y="21">Read-only</text></g>
    <g transform="translate(789 454)"><rect width="106" height="32" rx="6" fill="#475569"/><text class="abbr" x="13" y="21">↔</text><text class="badge" x="34" y="21">Proxy/Bridge</text></g>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" begin="2.8s" repeatCount="indefinite"/>
  </g>

  <!-- Ferramentas e DevOps -->
  <g>
    <text class="category" x="600" y="528" text-anchor="middle">FERRAMENTAS &amp; DEVOPS</text>
    <g transform="translate(184 544)"><rect width="74" height="32" rx="6" fill="#f05032"/><text class="abbr" x="13" y="21">◇</text><text class="badge" x="33" y="21">Git</text></g>
    <g transform="translate(266 544)"><rect width="92" height="32" rx="6" fill="#24292f" stroke="#71717a"/><text class="abbr" x="13" y="21">GH</text><text class="badge" x="39" y="21">GitHub</text></g>
    <g transform="translate(366 544)"><rect width="122" height="32" rx="6" fill="#6f42c1"/><text class="abbr" x="13" y="21">▶</text><text class="badge" x="34" y="21">GitHub Actions</text></g>
    <g transform="translate(496 544)"><rect width="94" height="32" rx="6" fill="#2496ed"/><text class="abbr" x="13" y="21">▦</text><text class="badge" x="35" y="21">Docker</text></g>
    <g transform="translate(598 544)"><rect width="86" height="32" rx="6" fill="#0e7490"/><text class="abbr" x="13" y="21">PKG</text><text class="badge" x="43" y="21">GHCR</text></g>
    <g transform="translate(692 544)"><rect width="82" height="32" rx="6" fill="#f2b84b"/><text class="abbr-dark" x="13" y="21">L</text><text class="badge-dark" x="32" y="21">Linux</text></g>
    <g transform="translate(782 544)"><rect width="78" height="32" rx="6" fill="#16a34a"/><text class="abbr" x="13" y="21">CI</text><text class="badge" x="36" y="21">CI/CD</text></g>
    <g transform="translate(868 544)"><rect width="126" height="32" rx="6" fill="#0891b2"/><text class="abbr" x="13" y="21">B/G</text><text class="badge" x="45" y="21">Blue-green</text></g>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" begin="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- Testes e qualidade -->
  <g>
    <text class="category" x="600" y="618" text-anchor="middle">TESTES &amp; QUALIDADE</text>
    <g transform="translate(245 634)"><rect width="142" height="32" rx="6" fill="#16a34a"/><text class="abbr" x="13" y="21">✓</text><text class="badge" x="34" y="21">Testes automatizados</text></g>
    <g transform="translate(395 634)"><rect width="144" height="32" rx="6" fill="#2563eb"/><text class="abbr" x="13" y="21">↔</text><text class="badge" x="34" y="21">Testes de integração</text></g>
    <g transform="translate(547 634)"><rect width="82" height="32" rx="6" fill="#7c3aed"/><text class="abbr" x="13" y="21">L</text><text class="badge" x="32" y="21">Lint</text></g>
    <g transform="translate(637 634)"><rect width="104" height="32" rx="6" fill="#db2777"/><text class="abbr" x="13" y="21">{ }</text><text class="badge" x="40" y="21">Contratos</text></g>
    <g transform="translate(749 634)"><rect width="126" height="32" rx="6" fill="#f2b84b"/><text class="abbr-dark" x="13" y="21">≈</text><text class="badge-dark" x="34" y="21">Reconciliação</text></g>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" begin="4.2s" repeatCount="indefinite"/>
  </g>

  <path d="M35 686 H1165" stroke="#34555a" stroke-width="1.5"/>
  <circle r="4" fill="#f2b84b"><animateMotion path="M35 686 H1165" dur="8s" repeatCount="indefinite"/></circle>
</svg>
