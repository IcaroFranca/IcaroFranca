<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Contribuições em colaboração</title>
  <desc id="desc">Participações de Icaro nos sistemas PDF, SGE, TPM, CDT, SSO e MKTMAIL da Flexibase</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#071a1f"/>
      <stop offset="0.5" stop-color="#0d282e"/>
      <stop offset="1" stop-color="#071a1f"/>
    </linearGradient>
    <style>
      .kicker { font: 600 11px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 2px; fill: #25c4c7; }
      .heading { font: 700 22px 'Segoe UI', Ubuntu, sans-serif; fill: #f3f1e9; }
      .name { font: 700 17px 'Segoe UI', Ubuntu, sans-serif; fill: #f3f1e9; }
      .area { font: 600 10px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 1px; }
      .text { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #9ab0b2; }
      .icon { font: 800 17px 'Segoe UI', Ubuntu, sans-serif; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="389" rx="16" fill="url(#bg)" stroke="#25464c"/>
  <text class="kicker" x="38" y="37">CONTRIBUIR TAMBÉM É SABER SOMAR</text>
  <text class="heading" x="38" y="67">Participações pontuais que ajudaram outros produtos a avançar.</text>

  <g transform="translate(38 95)">
    <rect width="350" height="110" rx="12" fill="#102f35" stroke="#25c4c7"/>
    <rect x="18" y="18" width="42" height="42" rx="10" fill="#25c4c7" fill-opacity="0.14" stroke="#25c4c7"/>
    <path d="M29 26h15l7 7v19H29Z M44 26v8h7" fill="none" stroke="#25c4c7" stroke-width="2"/>
    <text class="name" x="76" y="35">PDF</text><text class="area" x="76" y="54" fill="#25c4c7">DOCUMENTOS</text>
    <text class="text" x="18" y="82">SSO · produção · interface</text><text class="text" x="18" y="99">Apoio à entrada segura no ecossistema.</text>
    <animate attributeName="opacity" values="0.78;1;0.78" dur="5s" begin="0s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(425 95)">
    <rect width="350" height="110" rx="12" fill="#102f35" stroke="#f2b84b"/>
    <rect x="18" y="18" width="42" height="42" rx="10" fill="#f2b84b" fill-opacity="0.14" stroke="#f2b84b"/>
    <path d="M41 23 29 42h10l-4 15 16-23H40Z" fill="none" stroke="#f2b84b" stroke-width="2" stroke-linejoin="round"/>
    <text class="name" x="76" y="35">SGE</text><text class="area" x="76" y="54" fill="#f2b84b">ENERGIA</text>
    <text class="text" x="18" y="82">CI/CD · Supabase · ambiente</text><text class="text" x="18" y="99">Preparação e estabilidade para publicação.</text>
    <animate attributeName="opacity" values="0.78;1;0.78" dur="5s" begin="0.7s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(812 95)">
    <rect width="350" height="110" rx="12" fill="#102f35" stroke="#a78bfa"/>
    <rect x="18" y="18" width="42" height="42" rx="10" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa"/>
    <path d="M32 27a10 10 0 0 0 12 13L54 50l-6 6-10-10a10 10 0 0 1-13-12l7 7 6-6Z" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>
    <text class="name" x="76" y="35">TPM</text><text class="area" x="76" y="54" fill="#a78bfa">MANUTENÇÃO</text>
    <text class="text" x="18" y="82">Painel · operação · deploy</text><text class="text" x="18" y="99">Evolução de fluxo e apoio à publicação.</text>
    <animate attributeName="opacity" values="0.78;1;0.78" dur="5s" begin="1.4s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(38 230)">
    <rect width="350" height="110" rx="12" fill="#102f35" stroke="#4ade80"/>
    <rect x="18" y="18" width="42" height="42" rx="10" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80"/>
    <rect x="26" y="26" width="10" height="26" rx="2" fill="none" stroke="#4ade80" stroke-width="2"/><rect x="42" y="26" width="10" height="26" rx="2" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text class="name" x="76" y="35">CDT</text><text class="area" x="76" y="54" fill="#4ade80">TAREFAS</text>
    <text class="text" x="18" y="82">Frontend · estabilidade · fluxos</text><text class="text" x="18" y="99">Correções localizadas em produto existente.</text>
    <animate attributeName="opacity" values="0.78;1;0.78" dur="5s" begin="2.1s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(425 230)">
    <rect width="350" height="110" rx="12" fill="#102f35" stroke="#fb7185"/>
    <rect x="18" y="18" width="42" height="42" rx="10" fill="#fb7185" fill-opacity="0.14" stroke="#fb7185"/>
    <rect x="28" y="37" width="22" height="18" rx="4" fill="none" stroke="#fb7185" stroke-width="2"/><path d="M32 37v-5a7 7 0 0 1 14 0v5" fill="none" stroke="#fb7185" stroke-width="2"/>
    <text class="name" x="76" y="35">SSO</text><text class="area" x="76" y="54" fill="#fb7185">IDENTIDADE</text>
    <text class="text" x="18" y="82">Acesso · provisionamento · segurança</text><text class="text" x="18" y="99">Colaboração na identidade compartilhada.</text>
    <animate attributeName="opacity" values="0.78;1;0.78" dur="5s" begin="2.8s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(812 230)">
    <rect width="350" height="110" rx="12" fill="#102f35" stroke="#38bdf8"/>
    <rect x="18" y="18" width="42" height="42" rx="10" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8"/>
    <rect x="26" y="29" width="28" height="22" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/><path d="m27 31 13 10 13-10" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text class="name" x="76" y="35">MKTMAIL</text><text class="area" x="76" y="54" fill="#38bdf8">COMUNICAÇÃO</text>
    <text class="text" x="18" y="82">Containers · GHCR · blue-green</text><text class="text" x="18" y="99">Adequação ao padrão de infraestrutura.</text>
    <animate attributeName="opacity" values="0.78;1;0.78" dur="5s" begin="3.5s" repeatCount="indefinite"/>
  </g>

  <path d="M70 365 H1130" stroke="#34555a" stroke-width="1.5"/>
  <circle r="4" fill="#f2b84b"><animateMotion path="M70 365 H1130" dur="7s" repeatCount="indefinite"/></circle>
</svg>
