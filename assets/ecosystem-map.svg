<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de atuação no ecossistema Flexibase</title>
  <desc id="desc">DASH, FoccoAPI, SGQ e Portal de Chamados como contribuições principais de Icaro, conectados a outros produtos internos</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#071a1f"/>
      <stop offset="1" stop-color="#0c252b"/>
    </linearGradient>
    <style>
      .kicker { font: 600 11px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 2px; fill: #25c4c7; }
      .heading { font: 700 24px 'Segoe UI', Ubuntu, sans-serif; fill: #f3f1e9; }
      .label { font: 700 15px 'Segoe UI', Ubuntu, sans-serif; fill: #f3f1e9; }
      .small { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #9ab0b2; }
      .chip { font: 600 10px 'Segoe UI', Ubuntu, sans-serif; fill: #071a1f; }
      .minor { font: 600 11px 'Segoe UI', Ubuntu, sans-serif; fill: #b8c9ca; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="16" fill="url(#panel)" stroke="#25464c"/>
  <text class="kicker" x="40" y="42">MAPA DE ATUAÇÃO · FLEXIBASE</text>
  <text class="heading" x="40" y="76">Produtos diferentes, uma experiência conectada.</text>
  <text class="small" x="40" y="100">As conexões representam frentes de trabalho — não o tráfego ou a arquitetura interna dos sistemas.</text>

